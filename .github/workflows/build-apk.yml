name: Build Island Editor APK

# Build APK offline-editor Island Editor buat Android 10 (API 29).
# Gak butuh gradlew/gradle-wrapper.jar dikomit ke repo — Gradle-nya
# disediain sama gradle/actions/setup-gradle di runner.
on:
  workflow_dispatch: {}
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NB: sengaja gak pakai action `android-actions/setup-android@v3` — action itu
      # nyoba install package legacy "tools" yang udah gak ada di cmdline-tools versi baru,
      # bikin exit code 1 ("Failed to find package 'tools'"). Runner ubuntu-latest GitHub
      # udah dateng dengan Android SDK + sdkmanager preinstall di $ANDROID_HOME, TAPI folder
      # cmdline-tools/<versi>/bin nya gak otomatis masuk PATH — makanya perlu dicari manual.
      - name: Install SDK platform 29 + build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_BIN=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager | sort -V | tail -1)
          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "sdkmanager gak ketemu di $SDK_ROOT/cmdline-tools — cek isi:"; find "$SDK_ROOT" -maxdepth 3
            exit 1
          fi
          export PATH="$(dirname "$SDKMANAGER_BIN"):$PATH"
          echo "pakai sdkmanager di: $SDKMANAGER_BIN"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-29" "build-tools;29.0.3"
          echo "$(dirname "$SDKMANAGER_BIN")" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: island-editor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

# Cara install: download artifact di atas, sideload ke HP (aktifin "Install dari
# sumber tidak dikenal" buat file manager/browser kamu). APK ini debug-signed
# (keystore bawaan Android SDK di runner) — cukup buat pemakaian sendiri,
# TIDAK cocok buat publish ke Play Store.
