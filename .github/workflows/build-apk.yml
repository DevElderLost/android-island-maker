name: Build Island Editor APK

# Build APK offline-editor Island Editor buat Android 10 (API 29).
# Gak butuh gradlew/gradle-wrapper.jar dikomit ke repo — Gradle-nya
# disediain sama gradle/actions/setup-gradle di runner.
on:
  workflow_dispatch: {}
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest TIDAK punya cmdline-tools/sdkmanager (cuma ada platform-tools,
      # build-tools, ndk). Jadi kita download cmdline-tools resmi dari Google dan pasang
      # SDK sendiri di $HOME/android-sdk (folder ini pasti writable, gak perlu sudo).
      - name: Install SDK platform 29 + build-tools
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
          mv /tmp/cmdline-extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-29" "build-tools;29.0.3" "build-tools;33.0.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: island-editor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

# Cara install: download artifact di atas, sideload ke HP (aktifin "Install dari
# sumber tidak dikenal" buat file manager/browser kamu). APK ini debug-signed
# (keystore bawaan Android SDK di runner) — cukup buat pemakaian sendiri,
# TIDAK cocok buat publish ke Play Store.
